[pytest]
# pytest's cache plugin keeps a marker directory beside the tests. Here it tried to
# create .pytest_cache in the repository root, Windows refused the path, and the run
# ended with two warnings and a stray empty pytest-cache-files-* directory. Nothing
# in this suite uses the cache -- no --lf, no --stepwise -- so it is switched off
# instead of worked around. Delete the addopts line to turn it back on.
addopts = -p no:cacheprovider

# so a bare 'pytest' from the root runs the right thing
testpaths = tests
